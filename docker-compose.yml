# Local development infrastructure only. Credentials here are throwaway
# defaults; never reuse them outside your machine.
name: fullstack-challenge

services:
  postgres:
    # Major version is pinned: upgrading it requires a dump/restore of the volume.
    image: postgres:15-alpine
    container_name: fullstack-challenge-db
    restart: unless-stopped
    ports:
      # Bound to localhost so the database is not reachable from the network.
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fullstack_challenge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fullstack_challenge']
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional web UI for the database. Start with: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fullstack-challenge-pgadmin
    profiles: ['tools']
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '127.0.0.1:5050:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
